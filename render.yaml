databases:
  - name: eldorsketch-db
    databaseName: eldorsketch_db
    user: eldorsketch_user
    plan: free

services:
  - type: web
    name: eldorsketch-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eldorsketch-db
          property: connectionString
      - key: STORAGE_TYPE
        value: local
      - key: ENVIRONMENT
        value: production
      - key: AI_PROVIDER
        value: huggingface
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: HF_TOKEN
        sync: false